<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment 002 · Tools and skills · OpenClaw Agents Lab</title>
<style>
    :root {
      color-scheme: light;
      --paper: #fff;
      --panel: #edf5f6;
      --ink: #182d39;
      --muted: #466070;
      --accent: #095d65;
      --line: #ccd9de;
      --deep: #142b36;
      --on-deep: #eff8fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font: 1rem/1.65 system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    a {
      color: var(--accent);
      text-underline-offset: .18em;
    }

    a:focus-visible,
    summary:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .wrap {
      max-width: 78rem;
      margin: auto;
      padding: clamp(1rem, 4vw, 3rem);
    }

    header p {
      max-width: 68ch;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      line-height: 1.23;
      overflow-wrap: anywhere;
    }

    h1 {
      max-width: 19ch;
      margin: .35em 0;
      font-size: clamp(2rem, 5vw, 3.7rem);
    }

    h2 {
      margin-top: 2em;
      border-bottom: 1px solid var(--line);
      padding-bottom: .4em;
    }

    h3 {
      margin-top: 1.8em;
    }

    .eyebrow {
      color: var(--accent);
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(12rem, 16rem) minmax(0, 1fr);
      gap: clamp(1rem, 5vw, 4rem);
      align-items: start;
    }

    .toc {
      position: sticky;
      top: 1rem;
    }

    .toc p {
      font-weight: 700;
    }

    nav ol {
      padding-left: 1.5rem;
    }

    nav li {
      margin: .3em 0;
    }

    main {
      min-width: 0;
    }

    main>h2:first-child {
      margin-top: 0;
    }

    p,
    li,
    td {
      overflow-wrap: anywhere;
    }

    pre {
      max-width: 100%;
      overflow: auto;
      background: var(--deep);
      color: var(--on-deep);
      border-radius: .45rem;
      padding: 1rem;
      line-height: 1.5;
    }

    code {
      font-family: ui-monospace, monospace;
      font-size: .92em;
    }

    :not(pre)>code {
      background: var(--panel);
      padding: .1em .24em;
      border-radius: .2em;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: .94rem;
    }

    th,
    td {
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line);
      padding: .5rem .7rem;
    }

    th {
      background: var(--panel);
    }

    details {
      border: 1px solid var(--line);
      border-radius: .45rem;
      margin: .85rem 0;
      padding: 1rem;
    }

    summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--accent);
    }

    blockquote {
      border-left: 3px solid var(--line);
      margin-left: 0;
      padding-left: 1rem;
      color: var(--muted);
    }

    hr {
      border: 0;
      border-top: 1px solid var(--line);
    }

    @media (max-width:48rem) {
      .layout {
        display: block;
      }

      .toc {
        position: static;
        margin-bottom: 2rem;
      }

      th,
      td {
        padding: .4rem;
      }
    }

    @media print {
      .layout {
        display: block;
      }

      .toc {
        position: static;
      }

      pre {
        white-space: pre-wrap;
        color: #000;
        background: #eee;
      }
    }
  
.toc {max-height:calc(100vh - 2rem);overflow:auto;padding:.25rem .4rem}
.toc .subsection {margin-left:1rem}
.table-scroll {overflow:auto;margin-block:1rem}
.table-scroll table {min-width:28rem}
.table-scroll:focus-visible {outline:3px solid var(--accent)}
main > p, main > ul, main > ol {max-width:78ch}
@media(max-width:48rem){.toc{max-height:none}}
</style>
</head>
<body>
<header><div class="wrap">
<nav aria-label="Lab navigation"><a href="../../index.html#reference">← Lab library</a></nav>

</div></header>
<div class="wrap">

<main>
<p>This experiment is planned. The original Markdown is a placeholder.</p>

</main>
</div>
</body>
</html>
